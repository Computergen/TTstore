<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | TULA MARKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <div class="loading-screen">
      <div class="loading-card">
        <div class="spinner"></div>
        <h3>Loading TULA MARKET</h3>
      </div>
    </div>

    <header class="site-header" data-header></header>

    <main class="container">
      <section class="page-top">
        <h1 class="page-title">Admin Dashboard</h1>
        <p class="page-copy">Review real vendor storefronts and marketplace records from one control panel.</p>
        </section>

      <section class="glass-card reveal">
        <div class="panel-header"><h3>Store Operations</h3><span class="badge">Vendor-first</span></div>
          <div id="adminStorePanel"><div class="empty-state"><strong>Loading store operations.</strong><p class="muted">Store data will appear here.</p></div></div>
      </section>

    </main>

    <footer class="site-footer" data-footer></footer>

    <script src="../firebase/firebase-config.js"></script>
    <script src="../firebase/auth.js"></script>
    <script src="../firebase/firestore.js"></script>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
