<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose New Password | TULA MARKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <div class="loading-screen"><div class="loading-card"><div class="spinner"></div><h3>Securing your account</h3></div></div>
    <header class="site-header" data-header></header>
    <main class="container" style="padding: 48px 0;">
      <section class="form-card reveal">
        <p class="eyebrow">Account security</p>
        <h1 class="page-title">Choose a new password</h1>
        <p class="page-copy">Create a fresh password for <strong id="resetAccountEmail">your account</strong>.</p>
        <form id="resetPasswordForm" novalidate>
          <div class="form-group"><label for="resetPassword">New Password</label><input id="resetPassword" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required /></div>
          <div class="form-group"><label for="resetConfirmPassword">Confirm New Password</label><input id="resetConfirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Re-enter your password" required /></div>
          <button id="resetPasswordBtn" class="btn btn-primary" type="submit">Update Password</button>
        </form>
        <p id="resetMessage" class="muted" role="status" style="margin-top: 12px;"></p>
        <p class="muted"><a href="login.html">Return to login</a></p>
      </section>
    </main>
    <footer class="site-footer" data-footer></footer>
    <script src="../firebase/firebase-config.js"></script>
    <script src="../firebase/auth.js"></script>
    <script src="../firebase/firestore.js"></script>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
