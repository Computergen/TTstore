<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | TULA MARKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <div class="loading-screen">
      <div class="loading-card">
        <div class="spinner"></div>
        <h3>Loading TULA MARKET</h3>
      </div>
    </div>

    <header class="site-header" data-header></header>

    <main class="container">
      <section class="page-top">
        <h1 class="page-title">Secure Checkout</h1>
        <p class="page-copy">Complete your purchase with a simple, premium checkout experience.</p>
      </section>
      <form id="checkoutForm" class="grid grid-2 reveal" novalidate>
        <article class="form-card">
          <h3>Customer Details</h3>
          <div class="form-group"><label for="checkoutName">Name</label><input id="checkoutName" type="text" autocomplete="name" placeholder="Your name" required /></div>
          <div class="form-group"><label for="checkoutEmail">Email</label><input id="checkoutEmail" type="email" autocomplete="email" placeholder="Your email" required /></div>
          <div class="form-group"><label for="checkoutAddress">Address</label><textarea id="checkoutAddress" rows="3" autocomplete="street-address" placeholder="Delivery address" required></textarea></div>
        </article>
        <article class="form-card">
          <h3>Payment & Summary</h3>
          <div class="form-group"><label for="paymentMethod">Payment Method</label><select id="paymentMethod"><option value="paystack">Paystack (card, transfer, USSD)</option><option value="cod">Cash on Delivery</option></select></div>
          <div id="checkoutItems" class="checkout-items"></div>
          <p class="muted">Subtotal: <strong id="checkoutSubtotal">₦0.00</strong></p>
          <p class="muted">Delivery: <strong id="checkoutDelivery">₦0.00</strong></p>
          <p class="muted">Transaction Fee: <strong id="checkoutFee">₦0.00</strong></p>
          <p class="price">Total: <strong id="checkoutTotal">₦0.00</strong></p>
          <button id="placeOrderBtn" class="btn btn-primary" type="submit">Continue to Payment</button>
          <p id="checkoutMessage" class="muted" role="status" style="margin-top: 12px;"></p>
        </article>
      </form>
    </main>

    <footer class="site-footer" data-footer></footer>

    <script>
      window.TULA_PAYSTACK_PUBLIC_KEY = window.TULA_PAYSTACK_PUBLIC_KEY || 'pk_test_ce73024aa2e8f9d581fe00bda87667f1d03952d6';
      window.TULA_MARKET_CONFIG = window.TULA_MARKET_CONFIG || {};
      window.TULA_MARKET_CONFIG.paystack = window.TULA_MARKET_CONFIG.paystack || {
        publicKey: window.TULA_PAYSTACK_PUBLIC_KEY
      };
    </script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script src="../firebase/firebase-config.js"></script>
    <script src="../firebase/auth.js"></script>
    <script src="../firebase/firestore.js"></script>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
