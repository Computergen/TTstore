<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics | Vendor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body class="vendor-dashboard-page">
    <div class="loading-screen"><div class="loading-card"><div class="spinner"></div><h3>Loading your analytics</h3></div></div>
    <header class="site-header" data-header></header>
    <main class="vendor-dashboard-shell">
      <aside class="vendor-sidebar" aria-label="Vendor navigation">
        <div class="vendor-sidebar-brand"><img class="brand-mark brand-logo" src="../../images/tmlogo.jpeg" alt="TULA MARKET logo" /></div>
        <nav class="vendor-sidebar-nav">
          <a href="./">Dashboard</a>
          <a href="./products.html">Products</a>
          <a href="./orders.html">Orders</a>
          <a class="active" href="./analytics.html">Analytics</a>
          <a href="./#store-settings">Store Settings</a>
          <a href="./#profile">Profile</a>
          <button id="vendorLogoutBtn" type="button">Logout</button>
        </nav>
      </aside>
      <section class="vendor-dashboard-main">
        <div class="vendor-dashboard-head">
          <div><p class="eyebrow">Performance</p><h1 class="page-title">Analytics</h1><p class="page-copy">Track your storefront performance and customer engagement.</p></div>
        </div>
        <section class="vendor-section dashboard-placeholder">
          <div class="section-header"><div><h2 class="section-title">Store performance</h2></div><span class="badge">Coming next</span></div>
          <div class="dashboard-grid">
            <article class="stat-card"><h3>Views</h3><p class="price">0</p><p class="muted">Store views</p></article>
            <article class="stat-card"><h3>Product clicks</h3><p class="price">0</p><p class="muted">Catalog engagement</p></article>
            <article class="stat-card"><h3>Conversion</h3><p class="price">--</p><p class="muted">No orders yet</p></article>
          </div>
        </section>
      </section>
    </main>
    <script src="../../firebase/firebase-config.js"></script>
    <script src="../../firebase/auth.js"></script>
    <script src="../../firebase/firestore.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script>document.getElementById('vendorLogoutBtn')?.addEventListener('click', () => { window.tulaAuth?.signOut(); window.location.href = '../../index.html'; });</script>
  </body>
</html>
